<!DOCTYPE html>
<html>
   <head>
      <title> Youtube.com clone </title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
      
      <style>
         p{
            font-family: Roboto, Arial;
         }
         .thumbnail{
            width:300px;
            height:170px;
         }
         .search-bar{
            display: block;
            text-align:center;
            margin-left: 330px;
            margin-right: 400px;
            width: 250px;
            border-radius:5px;
            margin-bottom:5px;
         }
       

         
         .video-title{
            width:280px;
            font-weight: 500;
            font-size:15px;
            line-height:20px;
            
         }
         
         .video-stats{
            font-size:15px;
            color: grey;
            margin-top:0px;
           
         }
          .video-preview{
            display:inline-block;
            width:300px;
            vertical-align: top;
            margin-right:5px;
         }
          .video-info-grid{
            display: grid;
            grid-template-columns: 50px 1fr;
           
            
         }
        
         .video-author{
            display:inline-block;
            margin-bottom:7px;
            width:280px;
            font-size:15px;
            color: grey;
            
        
         }
        
         
         
         .channel-picture{
            width:40px;
            vertical-align:top;
            margin-top:13px;
            margin-right:4px;
            
         }
         .video-info{
            
            width:250px;
            
            

         }      
         .profile-pic{
            width:90%;
            border-radius:50%;
          
            
         }
         .thumbnail-row{
            margin-bottom:5px;
            
         }
        
         
      </style>
   </head>
   <body>
      <input class="search-bar" type="text" placeholder="search">
      
      <div class="video-preview">
         <div class="thumbnail-row">
            <img class="thumbnail"src=".\/thumbnail-1.webp">
         </div>
   
         <div class="video-info-grid">
            <div class="channel-picture">
               <img class="profile-pic" src=".\photo/channel-1.jpeg">
            </div>
            <div class="video-info">
                <p class="video-title">
                  Talking Tech and AI with Google CEO Sundar Pichai !
                </p>
                <P class="video-author">
                   Marques Brownlee &#10004;
                </P>
             
                <p class="video-stats">
                   3.4M views &#183; 2 monnths ago
                </p>
               
            </div>
         </div> 
      </div>
      <div class="video-preview">
         <div class="thumbnail-row"> 
            <img class="thumbnail"src=".\photo/thumbnail-2.webp">
         </div> 

         <div class="video-info-grid">
            <div class="channel-picture">
               <img class="profile-pic" src=".\photo/channel-2.jpeg">
            </div>
            <div class="video-info">
               <p class="video-title">
                  Try not to laugh challenge #9
               </p>
               <P class="video-author">
                  Markilpier 
               </P>
               <p class="video-stats">
                  19M views &#183; 2 years ago
               </p>
            </div>
         </div>
      </div>
       <div class="video-preview">
         <div class="thumbnail-row"> 
            <img class="thumbnail"src=".\photo/maxy.webp">
         </div> 

         <div class="video-info-grid">
            <div class="channel-picture">
               <img class="profile-pic" src=".\photo/logo1.webp">
            </div>
            <div class="video-info">
               <p class="video-title">
                  winning is hard but not harder than the regret of losing  #9
               </p>
               <P class="video-author">
                  Max verstappen
               </P>
               <p class="video-stats">
                  81M views &#183;  1 month ago
               </p>
            </div>
         </div>
      </div>
         
      

  

   </body>

</html>
